<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="32" height="32" rx="7.5" fill="url(#bgGrad)" />
  <rect width="30" height="30" x="1" y="1" rx="6.5" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />

  <!-- Open Book Base Pages -->
  <g transform="translate(4.5, 7.5)">
    <!-- Left Page -->
    <path d="M11.5 14.5C8 13.5 3 13.5 1 14.8V3.5C3 2.2 8 2.2 11.5 3.3V14.5Z" fill="url(#bookGrad)" fill-opacity="0.9" />
    <!-- Right Page -->
    <path d="M11.5 14.5C15 13.5 20 13.5 22 14.8V3.5C20 2.2 15 2.2 11.5 3.3V14.5Z" fill="#10b981" />
    <!-- Spine Line -->
    <path d="M11.5 3.3V14.5" stroke="#047857" stroke-width="1.2" stroke-linecap="round" />
    <!-- Page text hints -->
    <line x1="3.5" y1="6" x2="9" y2="5.5" stroke="#064e3b" stroke-width="0.9" stroke-linecap="round" />
    <line x1="3.5" y1="8.5" x2="8.5" y2="8" stroke="#064e3b" stroke-width="0.9" stroke-linecap="round" />
    <line x1="3.5" y1="11" x2="7.5" y2="10.5" stroke="#064e3b" stroke-width="0.9" stroke-linecap="round" />
  </g>

  <!-- FootNote Sparkle / Star Citation Badge (Top Right) -->
  <g transform="translate(20.5, 3.5)" filter="url(#glow)">
    <path d="M4 0C4.3 2 6 3.7 8 4C6 4.3 4.3 6 4 8C3.7 6 2 4.3 0 4C2 3.7 3.7 2 4 0Z" fill="url(#sparkleGrad)" />
  </g>
</svg>
